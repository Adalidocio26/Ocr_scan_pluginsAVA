plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.ocrscanplugin'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ocrscanplugin"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // OCR on-device (gratis, requiere Google Play Services en el dispositivo).
    // Alternativa 100% offline sin Play Services: Tesseract4Android.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
